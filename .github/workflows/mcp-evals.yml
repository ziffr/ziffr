# Scenario evals for the MCP server (#614): what a person who knows nothing about Ziffr says to an assistant, played
# against the MCP server and the app with a real model (packages/mcp/evals). Nightly and on demand; no required check
# and it never fails the run because a scenario fails (the summary says which and why). The job holds ANTHROPIC_API_KEY
# (environment `ai-review`; without the key the evals say so and skip). It checks out the default branch only, never a
# pull request's head, and runs from the schedule or a person's button, so no pull request's code can read the key.
name: MCP evals
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Model to run the scenarios on (default claude-haiku-5-5)"
        required: false
      scenarios:
        description: "Comma-separated scenario ids (default all)"
        required: false
permissions:
  contents: read
concurrency:
  group: mcp-evals
  cancel-in-progress: false
jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    environment: ai-review
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.116.0
      - run: pnpm install --frozen-lockfile
      - name: Local Supabase (database and API)
        run: sudo sysctl -w net.ipv4.ip_local_port_range="60000 65535" >/dev/null; for i in 1 2 3; do supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,storage-api,postgres-meta && exit 0; supabase stop --no-backup || true; sleep 10; done; exit 1
      - name: The app, built and running
        run: |
          # The local Supabase's address and keys are fixed development values, not secrets.
          eval "$(supabase status -o json | node -e 'const s = JSON.parse(require("fs").readFileSync(0, "utf8")); for (const k of ["API_URL", "ANON_KEY", "SERVICE_ROLE_KEY"]) console.log(`export ${k}=${JSON.stringify(s[k])}`)')"
          export SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          pnpm --filter @ziffr/web build
          (cd apps/web && nohup node ./node_modules/next/dist/bin/next start -p 3000 > "$RUNNER_TEMP/app.log" 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/v1/openapi.json > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/app.log"; exit 1
      - name: The scenarios
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ZIFFR_EVAL_MODEL: ${{ inputs.model }}
          ZIFFR_EVAL_SCENARIOS: ${{ inputs.scenarios }}
          ZIFFR_EVAL_REPORT: ${{ runner.temp }}/mcp-evals.md
        run: |
          pnpm --filter @ziffr/mcp eval
          if [ -f "$ZIFFR_EVAL_REPORT" ]; then cat "$ZIFFR_EVAL_REPORT" >> "$GITHUB_STEP_SUMMARY"; else echo "MCP evals skipped: ANTHROPIC_API_KEY is not set." >> "$GITHUB_STEP_SUMMARY"; fi
