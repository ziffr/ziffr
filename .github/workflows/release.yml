# The Release button (ADR 0014): Actions → Release → Run workflow, on main, or `pnpm release`. A release is the
# current commit of main, tagged; nothing is committed, no pull request is opened, nothing waits for an approval.
#   tag      refuses unless main's CI passed on that commit, takes the release notes added to .changeset/ since the
#            last tag and the version they make (scripts/next-release.mjs), and tags the commit vX.Y.Z;
#   image    builds the image with that version, tries it with docker/compose.yml, and pushes X.Y.Z, X.Y and latest;
#   release  makes the GitHub release, marked Latest, from those notes, with the compose file and installer of the
#            version, and refreshes the Preview;
#   pack     builds and packs the npm packages at that version, with no way to publish;
#   packages publishes them to npm with provenance, in the environment `release` (npm's trusted publishing).
# main takes nothing without its required checks (check, core-db, numbers), so the release runs none of them again;
# the full mutation run stays nightly (numbers.yml). If a job fails, fix the cause and use "Re-run failed jobs": the
# tag is made once and never moved (the ruleset "release tags").
# Pressing the button is the owner's decision: only the repository's owner may start it, and only from main. Every job
# checks who started it, since one job can be run again on its own. Agents never start it (AGENTS.md, rule 12).
name: Release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  tag:
    if: github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the tag
      actions: read # read main's CI runs
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      notes: ${{ steps.next.outputs.notes }}
    steps:
      - name: Only the owner, only from main
        env:
          ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::Start the release from main."; exit 1; }
          [ "$ACTOR" = "$OWNER" ] || { echo "::error::Only $OWNER may release."; exit 1; }
      - name: main's CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The newest CI run of the push of this very commit to main: its jobs are the checks main requires.
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --commit "$GITHUB_SHA" --limit 1 --json status,conclusion,url --jq '.[0] // empty')
          [ -n "$run" ] || { echo "::error::main's CI has not run on $GITHUB_SHA. Wait for it, or push again."; exit 1; }
          status=$(jq -r .status <<<"$run"); conclusion=$(jq -r .conclusion <<<"$run"); url=$(jq -r .url <<<"$run")
          [ "$status" = completed ] || { echo "::error::main's CI on $GITHUB_SHA is still running ($url). Release once it passed."; exit 1; }
          [ "$conclusion" = success ] || { echo "::error::main's CI on $GITHUB_SHA did not pass ($conclusion, $url). Fix main first."; exit 1; }
          echo "CI passed on $GITHUB_SHA: $url"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # every tag, to find the last release
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: The version and the notes
        id: next
        run: |
          held=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*')
          [ -z "$held" ] || { echo "::error::$GITHUB_SHA is released already as $held."; exit 1; }
          node scripts/next-release.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Tag the commit
        env:
          TAG: ${{ steps.next.outputs.tag }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Ziffr $VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

  # The Docker image and the files to run it (spec 0015): built for Intel and ARM, started once with
  # docker/compose.yml and checked from outside (docker/smoke-test.sh) before it is pushed.
  image:
    needs: tag
    if: github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The commit the tag job checked and tagged; by its sha, as a branch of the tag's name would win over a name.
          ref: ${{ github.sha }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: The image for this runner, to try
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ziffr:candidate
          build-args: ZIFFR_VERSION=${{ needs.tag.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start it with the compose file and check it from outside
        working-directory: docker
        env:
          ZIFFR_IMAGE: ziffr:candidate
        run: |
          docker compose up -d --wait || { docker compose logs; exit 1; }
          sh smoke-test.sh http://localhost || { docker compose logs; exit 1; }
          docker compose down -v
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Version tags
        id: tags
        # `X.Y` and `latest` only while this is the newest release: an old run's job started again must not move them back.
        run: |
          newest=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/v||' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          list="ghcr.io/ziffr/ziffr:$VERSION"
          [ "$newest" = "$VERSION" ] && list="$list,ghcr.io/ziffr/ziffr:${VERSION%.*},ghcr.io/ziffr/ziffr:latest"
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - name: Push for Intel and ARM
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: ZIFFR_VERSION=${{ needs.tag.outputs.version }}
          cache-from: type=gha

  # Made once the image is pushed, so "Latest" and its compose file never point to an image that is not there yet.
  release:
    needs: [tag, image]
    if: github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the GitHub release and its files
      actions: write # start preview.yml
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The commit the tag job checked and tagged; by its sha, as a branch of the tag's name would win over a name.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: The notes, and the compose file and installer of this version
        env:
          # Through the environment, never into the script: the notes are text pull requests wrote.
          NOTES: ${{ needs.tag.outputs.notes }}
        run: |
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          node scripts/release-files.mjs "$VERSION" "$RUNNER_TEMP/files"
      # Made as a draft with its files, then published: a published release is never changed afterwards, so its
      # install.sh and compose.yml stay what this run made (and the repository can make releases immutable).
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("$RUNNER_TEMP/files/compose.yml" "$RUNNER_TEMP/files/install.sh")
          draft=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          case "$draft" in
            none) gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --draft --title "Ziffr $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${files[@]}" ;;
            true) gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "${files[@]}" --clobber ;;
            false) echo "$TAG is published already; left as it is."; exit 0 ;;
          esac
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
      # A tag pushed with the workflow's token starts no run of its own (GitHub's rule against loops); starting a
      # workflow by name is the one exception.
      - name: Refresh the Preview, which now starts after this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run preview.yml -R "$GITHUB_REPOSITORY" --ref main

  # The MIT packages others build on (@ziffr/sdk, @ziffr/feed-kit, @ziffr/mcp, @ziffr/feed-sql) carry the product's
  # version from 0.12.0 on, written into them here and never committed (their package.json says 0.0.0-dev). main's CI
  # tested each against the running app on this commit. Packed in a job of its own, with no OIDC token and no
  # environment while dependencies install and build.
  pack:
    needs: tag
    if: github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and pack at the release's version
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        # Every package gets the version first, so pnpm pack writes it where a package says workspace:* of another.
        run: |
          for p in sdk feed-kit mcp feed-sql; do (cd "packages/$p" && npm pkg set "version=$VERSION"); done
          for p in sdk feed-kit mcp feed-sql; do
            pnpm --filter "@ziffr/$p" build
            (cd "packages/$p" && pnpm pack --pack-destination "$RUNNER_TEMP/pack/$p")
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          path: ${{ runner.temp }}/pack
          if-no-files-found: error
          retention-days: 7

  # Only downloads the packed files and publishes them: nothing of the repository runs while the OIDC token exists.
  # After the GitHub release, so npm never has a version the Releases page does not.
  packages:
    needs: [tag, pack, release]
    if: github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment npm's trusted publishing names (repository ziffr/ziffr, workflow release.yml, environment release).
    environment: release
    permissions:
      contents: read
      id-token: write # npm provenance and trusted publishing
    steps:
      - name: Only the owner, only from main
        env:
          ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::Start the release from main."; exit 1; }
          [ "$ACTOR" = "$OWNER" ] || { echo "::error::Only $OWNER may release."; exit 1; }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages
          path: ${{ runner.temp }}/pack
      - name: Publish, each before the packages that depend on it
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        # Trusted publishing (set up for each package on npmjs.com): npm checks this workflow's OIDC identity, so there is
        # no token to store or leak. No registry-url above, as setup-node would write an .npmrc that asks for a token.
        # A version npm has already (a job run again) is left as it is: npm never takes the same version twice.
        run: |
          for p in sdk feed-kit mcp feed-sql; do
            if npm view "@ziffr/$p@$VERSION" version > /dev/null 2>&1; then echo "@ziffr/$p@$VERSION is published already."; continue; fi
            npx -y npm@11.6.2 publish "$RUNNER_TEMP/pack/$p"/*.tgz --provenance --access public
          done
