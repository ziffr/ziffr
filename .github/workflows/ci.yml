# Typecheck, lint and test every pull request and every push to the main branches (CONTRIBUTING.md).
name: CI
on:
  pull_request:
  push:
    branches: [main, next]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prose (Vale)
        run: |
          curl -sSL https://github.com/errata-ai/vale/releases/download/v3.27.0/vale_3.27.0_Linux_64-bit.tar.gz | tar xz vale
          ./vale --minAlertLevel=error docs/guides docs/specs README.md CONTRIBUTING.md AGENTS.md SECURITY.md CHANGELOG.md
      - name: Public surface changes come with docs
        if: github.event_name == 'pull_request'
        run: .github/scripts/docs-touched.sh
      - name: Changes people use or run come with a release note
        if: github.event_name == 'pull_request'
        run: .github/scripts/release-note-present.sh
