# CI (CONTRIBUTING.md): a pull request gets the quick checks (the check job: types, lint, unit tests, code health,
# secrets, prose, docs, guide and release note). The merge queue tests each group of pull requests on top of main
# with the full checks too (core-db, sharded, and numbers), and so does every push to main, whose run the release
# asks for (ADR 0014). main is the one branch, and releases are its tags (ADR 0004).
name: CI
on:
  pull_request:
  # The merge queue tests each group of pull requests on top of main before it lands, with the same required checks
  # (check, core-db, numbers). Steps about the pull request itself (its labels, docs, release note) ran on it already
  # and are skipped here.
  merge_group:
  push:
    branches: [main]
  # By hand, for a branch whose run was cancelled. The Release button only reads main's runs (ADR 0014).
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A newer push to a pull request cancels its older run. On main every commit keeps its run: the release asks for
  # the push run of the very commit it tags. The merge queue replaces groups itself.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Everything quick, on one install: types, lint, unit tests, code health (#177: nothing unused, no more duplication
  # or complexity than the ceilings), and the security pass (docs/security/threat-model.md):
  # no committed secrets, no known-vulnerable production dependency, no client component importing core code that
  # reaches the database, the app reaching the database only through the core; and the prose and release-note checks.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Lint includes the complexity ceiling (eslint.code-health.mjs).
      - run: pnpm lint
      - run: pnpm test
      - name: Code health (knip, duplication)
        run: pnpm health
      - name: Secrets (gitleaks, whole history)
        run: |
          curl -sSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .
      - name: Known-vulnerable dependencies (production)
        run: pnpm audit --prod
      - name: Client components import only pure core modules
        run: node .github/scripts/client-imports.mjs
      - name: The app reaches the database only through the core
        run: node .github/scripts/app-db-access.mjs
      - name: Prose (Vale)
        run: |
          curl -sSL https://github.com/errata-ai/vale/releases/download/v3.27.0/vale_3.27.0_Linux_64-bit.tar.gz | tar xz vale
          ./vale --minAlertLevel=error docs/guides docs/user-guide docs/specs docs/security README.md CONTRIBUTING.md AGENTS.md SECURITY.md CHANGELOG.md
      - name: Public surface changes come with docs
        if: github.event_name == 'pull_request'
        run: .github/scripts/docs-touched.sh
      - name: Changed screens come with their user guide chapter
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/guide-touched.mjs
      - name: Changes people use or run come with a release note
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release-note-present.sh
      - name: Migrations are only added, never changed
        if: github.event_name == 'pull_request'
        run: .github/scripts/migrations-add-only.sh

  # The full verification of calculations (spec 0022, docs/guides/calculation-tests.md): every Aggregation, Display
  # Period and Fiscal Year start against the reference on at least 1,000 generated series each, with a new seed.
  # On every pull request, beside the other jobs, when a change touches a calculation path
  # (.github/calculation-paths.txt); otherwise its steps are skipped and the job still succeeds. A personal repository
  # has no merge queue, so the pull request is the only gate: the full checks run there.
  numbers:
    runs-on: ubuntu-latest
    # The full-strength run takes a few minutes and mutation testing at most 20 (mutation-pr.sh stops it there).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Does this change touch a calculation path?
        id: changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event_name == 'merge_group' && github.event.merge_group.base_sha || 'HEAD^1' }}
        run: |
          base="$BASE"
          if .github/scripts/calculation-paths-touched.sh "$base"; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.changes.outputs.run == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.changes.outputs.run == 'true'
      - name: Calculations against the reference, full strength
        if: steps.changes.outputs.run == 'true'
        run: pnpm --filter @ziffr/core test:numbers
      # Mutation testing starts from the nightly run's results (numbers.yml): only mutants on lines this change touches,
      # or whose tests it changed, run again. Without them, only the changed lines are mutated. Either way it stops
      # after 20 minutes with a message, so a pull request never waits for hours (spec 0022).
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: steps.changes.outputs.run == 'true'
        with:
          path: |
            packages/core/reports/stryker-incremental.json
            packages/core/reports/stryker-baseline-date
          key: stryker-incremental-none
          restore-keys: stryker-incremental-
      - name: Mutation testing of the calculation modules this change touches
        if: steps.changes.outputs.run == 'true'
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event_name == 'merge_group' && github.event.merge_group.base_sha || 'HEAD^1' }}
        run: .github/scripts/mutation-pr.sh "$BASE" 1200

  # Core operations against a real Postgres with the migrations applied (spec 0001, testing decisions), in the merge
  # queue and on main only: a pull request gets the quick checks, and its group is tested in full before it lands.
  # Four jobs side by side, each with its own local Supabase: the core's database tests in three shards, and the app
  # (its API over HTTP, its production build, and the SDK, MCP server and Feeds against it). The job named core-db,
  # the required check, waits for all four and passes only if each did.
  core-db-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: core-db (core, shard ${{ matrix.shard }} of 3)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.116.0
      - run: pnpm install --frozen-lockfile
      - name: Local Supabase (database, API, auth and the test mail server)
        # A runner sometimes has one of Supabase's ports (554xx) taken for a moment by an outgoing connection: try again.
        # Supabase's ports (554xx) lie in Linux's range for outgoing connections (32768-60999), so now and then one is
        # taken when the database starts ("address already in use"). Outgoing connections get 60000-65535 instead.
        run: sudo sysctl -w net.ipv4.ip_local_port_range="60000 65535" >/dev/null; for i in 1 2 3; do supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,storage-api,postgres-meta && exit 0; supabase stop --no-backup || true; sleep 10; done; exit 1
      - name: The core's database tests, shard ${{ matrix.shard }} of 3
        # With a secrets key, as a real Installation runs: sealed columns are then sealed in every test, so a test that
        # reads one raw instead of through the core fails here (#471). The key is made up for this run and opens nothing.
        run: |
          export ZIFFR_SECRETS_KEY="$(openssl rand -base64 32)"
          pnpm --filter @ziffr/core test:db --shard=${{ matrix.shard }}/3
      # What a database dump holds (spec 0028): a test fills a sealed Workspace with words and numbers nobody could guess,
      # and the dump of this shard's database must not hold any of them (the control, which is not sealed, must be there).
      - name: The dump holds nothing that is sealed
        run: |
          export ZIFFR_SECRETS_KEY="$(openssl rand -base64 32)"
          export DUMP_NEEDLES_FILE="$RUNNER_TEMP/dump-needles.json"
          pnpm --filter @ziffr/core test:db src/workspace-keys-dump.db.test.ts
          DUMP_REQUIRE=1 node .github/scripts/dump-test.mjs

  core-db-app:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    name: core-db (the app, its API and its clients)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.116.0
      - run: pnpm install --frozen-lockfile
      - name: Local Supabase (database, API, auth and the test mail server)
        # Supabase's ports (554xx) lie in Linux's range for outgoing connections (32768-60999), so now and then one is
        # taken when the database starts ("address already in use"). Outgoing connections get 60000-65535 instead.
        run: sudo sysctl -w net.ipv4.ip_local_port_range="60000 65535" >/dev/null; for i in 1 2 3; do supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,storage-api,postgres-meta && exit 0; supabase stop --no-backup || true; sleep 10; done; exit 1
      - name: The API over HTTP (route handlers against the same database)
        run: pnpm --filter @ziffr/web test:db
      # The production build here also fails if the core's database module is bundled for a browser (next.config.ts).
      - name: The app, built and running, for the SDK and the MCP server
        run: |
          # The local Supabase's address and keys are fixed development values, not secrets.
          eval "$(supabase status -o json | node -e 'const s = JSON.parse(require("fs").readFileSync(0, "utf8")); for (const k of ["API_URL", "ANON_KEY", "SERVICE_ROLE_KEY"]) console.log(`export ${k}=${JSON.stringify(s[k])}`)')"
          export SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          pnpm --filter @ziffr/web build
          (cd apps/web && nohup node ./node_modules/next/dist/bin/next start -p 3000 > "$RUNNER_TEMP/app.log" 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/v1/openapi.json > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/app.log"; exit 1
      - name: The SDK against the running app
        run: pnpm --filter @ziffr/sdk test:app
      - name: The MCP server against the running app
        run: pnpm --filter @ziffr/mcp test:app
      - name: The feed kit, the SQL Feed and the Usage Feed against the running app
        run: |
          pnpm --filter @ziffr/feed-kit test:app
          pnpm --filter @ziffr/feed-sql test:app
          pnpm --filter @ziffr/feed-usage test:app

  # The required check: skipped on a pull request (which counts as passed), and in the merge queue and on main passed
  # only if every database job above passed. Its name stays core-db, so the ruleset and the release need no change.
  core-db:
    if: always()
    needs: [core-db-shard, core-db-app]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every database job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "::error::A database job did not pass ($r)."; exit 1; }; done
