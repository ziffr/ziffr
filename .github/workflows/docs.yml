# The docs site (ticket #551, apps/docs): built from the repository's docs and put on Cloudflare Pages. Two channels:
# the newest release is docs.ziffr.net (started by release.yml with the tag), and main is the "next" view, built after
# every push that touches the docs. Without the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID the
# deploy says so and succeeds. The build never sees the token: it runs in its own job, and only the one deploy step
# gets the secrets, with a pinned wrangler (at least two weeks old) and nothing from the repository installed.
name: Docs site
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "packages/*/README.md"
      - "apps/docs/**"
      - "apps/web/src/app/api/v1/**"
      - "*.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish as docs.ziffr.net (vX.Y.Z). Empty builds main as the next view."
        required: false
        type: string
permissions:
  contents: read
concurrency:
  # One group per channel, so an older release's run can never finish after a newer one's.
  group: docs-${{ inputs.tag && 'release' || 'next' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      channel: ${{ steps.which.outputs.channel }}
    steps:
      - name: Which channel
        id: which
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then echo "channel=next" >> "$GITHUB_OUTPUT"; exit 0; fi
          # The tag comes from a person typing it: only the shape of a release tag goes any further.
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::'$TAG' is not a release tag (vX.Y.Z)."; exit 1; }
          echo "channel=release" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
          # The install runs package scripts; they get no credentials from .git/config.
          persist-credentials: false
      - name: A release is built only from a tag of main, and only while it is the newest
        if: steps.which.outputs.channel == 'release'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$TAG is not on main."; exit 1; }
          newest=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          [ "$newest" = "$TAG" ] || { echo "::error::$TAG is not the newest release ($newest is); docs.ziffr.net keeps showing the newest."; exit 1; }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the site (broken internal links fail it)
        env:
          DOCS_CHANNEL: ${{ steps.which.outputs.channel }}
          # The GitHub links in the pages point at the tag of a release, at main otherwise.
          DOCS_REF: ${{ inputs.tag || 'main' }}
        run: pnpm --filter @ziffr/docs build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-site
          path: apps/docs/dist
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The secrets live in the environment "docs" (allowed to deploy from main only), not in the repository: a branch
    # of someone with write access, with an edited copy of this file, cannot reach them. No checkout and no
    # repository code here: they meet only the downloaded files and wrangler.
    if: github.ref == 'refs/heads/main'
    environment: docs
    permissions: {}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs-site
          path: site
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The release is the project docs.ziffr.net points at, main is its own project (the "next" view).
          PROJECT: ${{ needs.build.outputs.channel == 'release' && 'ziffr-docs' || 'ziffr-docs-next' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set as a repository secret, so the site was built but not deployed."
            echo "The docs site was built but not deployed: the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx --yes wrangler@4.156.0 pages deploy site --project-name "$PROJECT" --branch main --commit-dirty=true
