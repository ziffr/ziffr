# Dogfood (ticket #436): once a day, the download counts, stars and forks of this repository go as values into the
# Workspace on app.ziffr.net, through the GitHub Feed (packages/feed-github, docs/guides/github-feed.md). Without the
# repository secret ZIFFR_DOGFOOD_FEED_KEY the job says so and succeeds. Reads only public GitHub data; the Feed Key
# is the one secret and goes only to app.ziffr.net.
name: Dogfood downloads
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @ziffr/feed-github...
      - run: pnpm --filter @ziffr/feed-github bundle
      - name: Send today's counts
        env:
          ZIFFR_GITHUB_FEED_KEY: ${{ secrets.ZIFFR_DOGFOOD_FEED_KEY }}
          ZIFFR_GITHUB_FEED_URL: https://app.ziffr.net
          ZIFFR_GITHUB_REPO: ${{ github.repository }}
          # Only lifts GitHub's rate limit for the runner; the job's token has read access to this repository.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$ZIFFR_GITHUB_FEED_KEY" ]; then
            echo "The secret ZIFFR_DOGFOOD_FEED_KEY is not set, so nothing is sent. See docs/guides/github-feed.md."
            exit 0
          fi
          node packages/feed-github/dist/github-feed.mjs run
