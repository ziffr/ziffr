# An advisory AI review of every pull request (#578): GLOSSARY terms, the user guide chapters the change touches, and
# the rules of AGENTS.md, in one comment per pull request that each push updates. It never blocks a merge: it is no
# required check, the job may fail, and the script exits 0 on every error.
#
# Trust: the job holds ANTHROPIC_API_KEY (environment `ai-review`, which the owner creates; without it the job says so
# and does nothing). It uses `pull_request_target` on purpose: GitHub then runs this file from the BASE branch, so a
# pull request cannot change the workflow and read the key (with `pull_request` it could). That is only safe because
# NO CODE OF THE PULL REQUEST RUNS: the job checks out the base commit, never the head (never add `ref: head.sha`,
# `npm install` or anything that executes the pull request's files), keeps no credentials, and gets the diff through the
# API into the prompt as marked data. The environment deploys only from `main`. CODEOWNERS covers this file.
name: AI review
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    environment: ai-review
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/ai-review.mjs
