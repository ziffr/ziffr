# The full verification of calculations (spec 0022, docs/guides/calculation-tests.md), every night with a new seed,
# and mutation testing of every calculation module, whatever changed: a seed that finds a case the pull requests' runs missed shows up here. Also runs on demand.
name: Numbers
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  numbers:
    runs-on: ubuntu-latest
    # Mutating every calculation module takes a few hours (docs/guides/calculation-tests.md).
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Calculations against the reference, full strength
        run: pnpm --filter @ziffr/core test:numbers
      - name: Mutation testing of every calculation module
        env:
          NUMBERS_RUNS: "30"
          STRYKER_CONCURRENCY: "2"
        run: |
          start=$(date +%s)
          status=0
          pnpm --filter @ziffr/core test:mutation || status=$?
          node .github/scripts/mutation-summary.mjs packages/core/reports/mutation/mutation.json $(( $(date +%s) - start )) >> "$GITHUB_STEP_SUMMARY"
          exit $status
      # The results of this run are the baseline a pull request's mutation run starts from (ci.yml): it then tests only
      # the mutants on lines it changed, or whose tests changed. Kept whether or not the score was reached.
      - name: Keep the mutation results for pull requests
        if: always()
        run: date -u +%Y-%m-%d > packages/core/reports/stryker-baseline-date
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: always()
        with:
          path: |
            packages/core/reports/stryker-incremental.json
            packages/core/reports/stryker-baseline-date
          key: stryker-incremental-${{ github.run_id }}
      # A failed night (a counterexample at full strength, a surviving mutant) opens one issue, or adds to the open one, so it is
      # noticed even when nobody watches Actions; the pull requests' own runs are quick (ci.yml) and rely on this one.
      - name: Report a failed night
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The nightly Numbers run failed"
          body="The run of $(date -u +%Y-%m-%d) failed: $RUN (a counterexample at full strength with its seed, or a mutant no test kills). Read the failing step, fix the cause in a pull request, and close this issue when a night passes."
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number' || true)
          if [ -n "$open" ]; then gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"; else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi
