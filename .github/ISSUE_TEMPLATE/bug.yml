name: Bug
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "Steps, what you expected, what you saw. Screenshots help." }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version or commit }
  - type: markdown
    attributes: { value: "Security problems go to the Security tab, not here (SECURITY.md)." }
